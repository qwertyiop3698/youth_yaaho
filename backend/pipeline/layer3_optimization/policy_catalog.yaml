    budget_cap: 300_000_000  # 2026-07-25: 실제 KCB(전체 인구, 100,816명) 투입으로 원래 값 복원. 데모용 축소값(35%)이었던 105_000_000은 n=1500 리허설 전용
    eligibility:
      age_range:
        min: 19
        max: 39
        confidence: verified
      requires_no_home_ownership:
        column: 자가거주여부
        # 2026-07-25: 공식 데이터명세서(★데이터 사용 칼럼 정의서.xlsx) 확인 - "본인(개인)
        # 소유 주택에 거주하면 1". 0/3 등 나머지 코드의 세부 의미는 몰라도 "1이 아니면
        # 무주택"은 명세로 직접 검증 가능하므로 verified로 승격.
        excluded_value: 1
