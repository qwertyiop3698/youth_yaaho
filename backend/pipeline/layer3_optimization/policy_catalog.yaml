# Layer 3 정책 카탈로그
#
# docs/05_optimization_engine.md의 정책 카탈로그 표를 기반으로 하되, 실제 자격조건은
# "부산시 정책 공고 기준으로 업데이트 필요"(doc05 명시)한 placeholder다.
#
# Δrisk_ip 공식 (2026-07-08/09 사용자 승인)
# -----------------------------------------
#   Δrisk_ip = risk_probability_i × relevance_score_ip × effectiveness_prior_p
#
#   relevance_score_ip = target_domains에 명시된 도메인지수들을 sigmoid(z)로 0~1
#   압축한 뒤 가중평균(가중치는 아래 표 그대로, 합이 1이 아니어도 내부에서 정규화).
#
#   effectiveness_prior_p: 정책별 초기 효과 "가정치"(0~1). **실제 근거 없는 가정값**이다.
#   Thompson Sampling(thompson_sampling.py)이 라운드를 거치며 추정한 사후평균으로
#   나중에 교체 가능하도록 lp_allocator.build_and_solve_lp()의 effectiveness_override
#   인자로 넘겨 대체할 수 있다(doc05: "추후 5-2 밴딧 결과로 갱신"). 발표 시 이 값이
#   가정치라는 점을 반드시 명시할 것.
#
# youthcenter_plcy_no (2026-07-15 온통청년 Open API 승인 후 추가)
# -------------------------------------------------------------------------
#   온통청년 Open API(GET https://www.youthcenter.go.kr/go/ythip/getPlcy)의
#   plcyNo(정책번호)를 실제로 조회해서 매핑한 값이다(동명 정책이 타 지자체에도
#   많아 sprvsnInstCdNm에 "부산광역시"가 포함된 항목만 선택). 추천 응답 시
#   app/services/youthcenter_service.py가 이 번호로 실시간 상세조회를 해서
#   aplyUrlAddr(신청 URL)을 채워 넣는다(실패/미설정 시 url=None으로 폴백).
#
#   "희망신용상담센터"는 API상 실제 정책명이 "부산 청년 신용회복 지원"으로
#   바뀌어 있고 aplyUrlAddr이 비어 있어 refUrlAddr1로 대체 조회된다(정상 동작).
#
# eligibility 구조 (2026-07-09 사용자 확정)
# -------------------------------------------
#   각 규칙은 confidence: verified | assumed_unresolved_codebook 중 하나를 가진다.
#     - verified: 실제 데이터로 검증 가능. expected_value(특정 값이면 충족) 또는
#       excluded_value(특정 값만 아니면 충족, 나머지 코드의 세부 의미는 몰라도 됨)
#       형태로 표현한다(연령대, 2026-07-25부터 자가거주여부의 무주택 조건도 해당 -
#       공식 데이터명세서로 "1=본인소유주택거주"만 확인되면 "1이 아니면 무주택"은
#       검증 가능하기 때문. 코드값 전체를 다 알아야만 verified인 건 아니다).
#     - assumed_unresolved_codebook: 코드북이 불확실하거나 아예 해당 컬럼이 데이터에
#       없음(세대주 여부, 근로 여부 등 - 이 프로젝트가 받은 42개 컬럼 명세에 자체가
#       없어 원천적으로 확인 불가). 이 경우 "자격 있음으로 간주 + 경고 로그"로 처리한다
#       (임의로 특정 코드값=자격충족이라고 단정하지 않음).
#   주의: "청년디딤돌카드 플러스"의 미취업 조건에 Thin Filer 여부를 프록시로 쓰지
#   않는다 - Thin Filer(신용이력 없음)와 미취업은 별개 개념이라 잘못된 대체가 될 수
#   있다(Layer2 event 정의에서 Thin Filer를 위험 프록시로 쓰지 않기로 한 결정과 일관).
#
# budget_cap 데모용 축소 (2026-07-10 사용자 승인, 실측 기반으로 재조정)
# -------------------------------------------------------------------------
#   원래 budget_cap은 실제 부산시 전체 청년 인구 규모를 가정한 값이라, n=1500 합성
#   인구로 실스케일 리허설을 해보니 예산이 전혀 병목이 되지 않았다(0.5x~1.5x 전
#   구간에서 coverage_overall이 0.204로 완전히 평평함 - 자격조건 통과 인원 자체가
#   이미 예산보다 훨씬 적어서 예산을 아무리 늘려도 배정이 안 늘어남).
#
#   처음엔 "n=1500 기준 실제 배정 인원의 절반" 정도로 어림잡아 축소했는데, 그렇게
#   줄인 값으로 다시 돌려보니 1500명x6정책=9000개 이진변수 MIP(lp_allocator.py)의
#   branch-and-bound가 몇 초가 아니라 30초(타임아웃)까지 걸리는 경우가 있었다.
#   그래서 원래 budget_cap의 여러 비율(10%~100%)로 실제 solve 시간을 측정해봤는데,
#   결과가 "빡빡할수록 무조건 느려진다"처럼 단순하지 않았다 - 100%/70%/50%/40%/
#   30%/25%는 전부 30초 제한에 걸렸고(near-optimal 근사해로 종료), 유독 35%/20%/
#   15%/10%만 1~2초 만에 증명된 최적해로 끝났다(knapsack형 MIP 특유의 현상 - 특정
#   예산 값이 우연히 조합적으로 애매한 근접해가 많은 구간에 걸리면 느려지고, 그렇지
#   않으면 금방 풀린다. "타이트함의 정도"가 아니라 "그 값이 우연히 어떤 조합
#   구간에 있는지"가 관건이었다).
#
#   그래서 실측으로 확인된 "빠르고 증명된 최적해" 구간 중 커버리지가 가장 큰 35%를
#   골라 각 budget_cap을 축소했다. 다만 sensitivity_analysis.py의 0.5x~1.5x 스윕이
#   이 35% 기준값을 다시 배수해 움직이므로, 스윕 도중 다른 배수 지점이 우연히
#   "느린 구간"에 걸릴 가능성은 여전히 남아있다 - 그래서 lp_allocator.py에
#   DEFAULT_SOLVER_TIME_LIMIT_SECONDS(30초)를 안전장치로 추가해뒀다(느린 지점을
#   만나도 무한정 걸리지 않고 30초 내에 근사해 + is_optimal=False로 종료됨).
#
#   2026-07-25 갱신: 실제 KCB 데이터(전체 인구, 100,816명)가 투입돼 위 지시대로
#   budget_cap을 전부 "원래 값(전체 인구 기준)"으로 되돌렸다. 데모용 35% 축소값은
#   n=1500 리허설 전용이었는데 그대로 100,816명 규모에 남아있었던 게 실제로
#   LP 하드행(21분+)의 원인 중 하나로 의심됨 - 예산은 그대로인데 경쟁 인구만
#   67배 늘어 예산이 극도로 빠듯해져 knapsack형 조합폭발을 유발했을 가능성이 큼.
#   DEFAULT_SOLVER_TIME_LIMIT_SECONDS(lp_allocator.py) 안전장치는 그대로 유지한다.

policies:
  청년월세지원:
    youthcenter_plcy_no: "20260513005400213199"  # 부산 청년 월세 지원
    target_domains:
      주거비압박지수: 1.0
    effectiveness_prior: 0.5
    unit_cost: 2_400_000
    budget_cap: 500_000_000  # 2026-07-25: 실제 KCB(전체 인구, 100,816명) 투입으로 원래 값 복원(주석에 미리 남겨둔 지시대로). 데모용 축소값(35%)이었던 175_000_000은 n=1500 리허설 전용
    eligibility:
      age_range:
        min: 19
        max: 34
        confidence: verified
      requires_no_home_ownership:
        column: 자가거주여부
        # 2026-07-25: 공식 데이터명세서(★데이터 사용 칼럼 정의서.xlsx) 확인 - "본인(개인)
        # 소유 주택에 거주하면 1". 0/3 등 나머지 코드의 세부 의미는 몰라도 "1이 아니면
        # 무주택"은 명세로 직접 검증 가능하므로 verified로 승격.
        excluded_value: 1
        confidence: verified

