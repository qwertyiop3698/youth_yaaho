# Layer 0 컬럼 그룹 매핑 설정
#
# docs/02_data_missing_value_framework.md 의 "컬럼 그룹별 처리 전략" 판단표를 그대로
# config 파일로 옮긴 것. 실제 KCB 데이터 투입 시 컬럼명/구성이 바뀌면 이 파일만 고치면
# 되고(CLAUDE.md "컬럼명 하드코딩 최소화" 원칙), profiler.py/cleaner.py 코드는 그대로 둔다.
#
# 여기서 참조하는 sample.csv/column_spec.xlsx 는 발제 측 5행 목업이지 실제 KCB 데이터가
# 아니므로, 여기서 관찰된 값(-99999999 sentinel, 자가거주여부=3 등)은 "실제 데이터의
# 확정된 특징"이 아니라 "이럴 가능성에 대비한 방어적 설정"으로 취급한다.
#
# missing_strategy 종류
# ---------------------
#   none                    : 0 = 정상 비즈니스 값(거래/연체/이직 없음 등). 결측 아님. 처리 없음.
#   unknown_category        : 범주형. null 또는 codebook 밖의 값을 "unknown" 카테고리로 대체
#                              + `_was_missing` 플래그. (최빈값 대체 금지 - 임의 대체는 편향 유발)
#   flag_only               : 0이 정상이지만 그 자체가 신호이므로 원본 값은 그대로 두고
#                              `flag_name`으로 지정한 별도 신호 컬럼만 추가.
#   ambiguous_flag          : 0/결측 여부가 애매한 경우. median 대체 + `_was_missing` 플래그 +
#                              profiling_report의 needs_human_review 목록에 하이라이트.
#   median_impute           : 이상값(음수/0 등, abnormal_if로 정의)·결측을 전체 median으로
#                              대체 + `_was_missing` 플래그.
#   regional_median_impute  : sentinel/이상값을 지역 단위(행정동 -> 시군구 -> 전체) 계층적
#                              median으로 대체 + `_was_missing` 플래그. join_adapter.py 사용.
#   conditional_thin_filer  : 신용평점 전용 처리. Thin Filer 여부에 따라 분기.
#   drop_column             : 컬럼 전체 삭제(명세상 "열 삭제" 대상이며 파이프라인에 불필요한 컬럼).
#
# sentinel_check: true 인 컬럼은 profiler가 known_sentinel_values(정확값 매칭)와
# 통계적 이상치(IQR 기반, 표본이 min_sample_for_iqr 이상일 때만) 를 함께 스캔한다.
#
# is_quasi_identifier: true 인 컬럼 (준식별정보 - 재식별 위험)
# ---------------------------------------------------------------
# column_spec.xlsx의 PII구분="준식별정보" 컬럼 중, 특히 거주지/근무지 시군구코드·행정동은
# "명세상 열삭제"가 단순 중복컬럼 정리가 아니라 위치정보 재식별 위험을 낮추려는 개인정보
# 보호 목적이었을 가능성이 높다는 점이 확인됨(2026-07-08 논의). 그래서 역할을 분리한다:
#   - 조인(join_adapter.py) / spatial CV(docs/04) / 행정용 대시보드 집계용으로는 유지한다
#     (그래서 missing_strategy=drop_column을 쓰지 않고 unknown_category로 원본을 보존)
#   - 그러나 Cox/GMM 등 개인별 리스크 모델의 raw feature 목록에는 넣지 않는다.
#     cleaner.get_quasi_identifier_columns()/assert_no_quasi_identifier_leakage()로
#     get_leakage_columns()와 동일한 방식으로 Layer2에서 강제한다.
# 주의: column_spec.xlsx엔 성별/연령대/자가거주여부 등 다른 컬럼도 PII구분=준식별정보로
# 표시돼 있지만, 그건 인구통계 공변량으로서 모델 피처에 정상적으로 쓰이는 컬럼이라 여기
# 대상이 아니다. 이 플래그는 "위치 조인키"처럼 재식별 위험이 특히 큰 컬럼에 한정한다.

groups:
  personal_info:
    label: 신상정보
  income:
    label: 소득정보
  asset_housing:
    label: 자산/주거
  loan_card_delinquency:
    label: 대출/카드/연체
  estimated_model:
    label: 추정모형항목
  life_pattern:
    label: 라이프패턴
  other:
    label: 기타

columns:
  성별:
    group: personal_info
    dtype: categorical
    zero_meaning: not_applicable
    missing_strategy: unknown_category
    codebook: [1, 2]
    notes: "1/2 코드. 실제 성별 매핑은 코드북 필요(당일 확인)."

  연령대:
    group: personal_info
    dtype: categorical
    zero_meaning: not_applicable
    missing_strategy: unknown_category
    codebook: null
    notes: "5세단위 연령대. 18~19세 분리, 75세이상 세분화(명세 항목설명). 코드북 미확정."

  직업군:
    group: personal_info
    dtype: categorical
    zero_meaning: not_applicable
    missing_strategy: unknown_category
    codebook: null
    notes: "법인대표>자영업자>급여소득>기타 순 대표직업군. sample엔 420/910만 등장하나 전체 코드 미확정(docs/02)."

  직업군상세:
    group: personal_info
    dtype: categorical
    zero_meaning: not_applicable
    missing_strategy: unknown_category
    codebook: null
    notes: "sample.csv엔 없음(명세엔 존재). 실데이터 대비 방어적으로 미리 등록."

  거주지 시군구 코드:
    group: personal_info
    dtype: categorical
    zero_meaning: not_applicable
    missing_strategy: unknown_category
    codebook: null
    join_role: sigungu
    join_scope: residence
    pii_classification: 준식별정보
    is_quasi_identifier: true
    notes: >
      명세상 처리방법=열삭제 이지만 docs/02의 조인키 이중화 원칙(행정동 우선, 실패 시
      시군구코드 fallback) 때문에 Layer0에서는 삭제하지 않고 유지한다. 다만 명세의
      PII구분=준식별정보(재식별 위험) 표시를 존중해, 조인/spatial CV/행정 집계용으로만
      쓰고 Cox/GMM 등 개인별 모델의 raw feature 목록에는 넣지 않는다
      (get_quasi_identifier_columns() 참고).

  근무지 시군구 코드:
    group: personal_info
    dtype: categorical
    zero_meaning: not_applicable
    missing_strategy: unknown_category
    codebook: null
    join_role: sigungu
    join_scope: workplace
    pii_classification: 준식별정보
    is_quasi_identifier: true
    notes: "거주지 시군구 코드와 동일 사유로 유지(명세는 열삭제 대상) + 동일하게 준식별정보로 취급."

  거주지행정동:
    group: personal_info
    dtype: categorical
    zero_meaning: not_applicable
    missing_strategy: unknown_category
    codebook: null
    join_role: dong
    join_scope: residence
    pii_classification: 준식별정보
    is_quasi_identifier: true
    notes: "sample.csv엔 없음(명세엔 존재). 실데이터에 있으면 조인 1순위 키로 사용. 준식별정보."

  근무지행정동:
    group: personal_info
    dtype: categorical
    zero_meaning: not_applicable
    missing_strategy: unknown_category
    codebook: null
    join_role: dong
    join_scope: workplace
    pii_classification: 준식별정보
    is_quasi_identifier: true
    notes: "sample.csv엔 없음(명세엔 존재). 준식별정보."

  추정가구원수:
    group: personal_info
    dtype: numeric
    zero_meaning: not_applicable
    missing_strategy: drop_column
    notes: "명세상 처리방법=열삭제. sample.csv에도 없음. 실데이터에 존재해도 파이프라인에서 제거."

  추정월소득:
    group: income
    dtype: numeric
    zero_meaning: ambiguous
    missing_strategy: ambiguous_flag
    notes: >
      docs/02: "애매한 경우(예: 추정월소득=0)는 별도 플래그로 표시 후 사람이 확인하도록
      리포트에 하이라이트". median 대체 + `_was_missing` 플래그 + needs_human_review 등재.

  증빙연소득:
    group: income
    dtype: numeric
    zero_meaning: normal
    missing_strategy: flag_only
    flag_name: 증빙연소득_증빙없음
    notes: "0 = 증빙자료 없음(정상, 결측 아님). 원본 유지 + '증빙없음' 신호 컬럼만 추가(docs/02)."

  추정 연소득:
    group: income
    dtype: numeric
    zero_meaning: abnormal
    missing_strategy: median_impute
    abnormal_if: "<= 0"
    notes: "0/음수는 이상값. median 대체(문서상 KNN도 대안, MVP는 median) + `_was_missing` 플래그."

  2년전 추정 연소득 금액:
    group: income
    dtype: numeric
    zero_meaning: abnormal
    missing_strategy: median_impute
    abnormal_if: "<= 0"
    notes: "소득증감률(Layer1) 분모/비교값으로 쓰임. 추정 연소득과 동일 기준 적용."

  2년내 이직후 소득 증감액:
    group: income
    dtype: numeric
    zero_meaning: normal
    missing_strategy: none
    notes: "명세: 2년내 직장명이력건수=0이면 0원으로 표기(정상값). 결측 아님."

  총자산평가금액(주택):
    group: asset_housing
    dtype: numeric
    zero_meaning: abnormal
    missing_strategy: regional_median_impute
    sentinel_check: true
    known_sentinel_values: [-99999999]
    join_scope: residence
    notes: "자산평가금액 0은 비정상으로 간주. 지역(행정동->시군구->전체) median 대체 + 플래그."

  순자산평가금액(주택):
    group: asset_housing
    dtype: numeric
    zero_meaning: abnormal
    missing_strategy: regional_median_impute
    sentinel_check: true
    known_sentinel_values: [-99999999]
    join_scope: residence
    notes: "총자산평가금액(주택)과 동일 처리."

  자가거주여부:
    group: asset_housing
    dtype: categorical
    zero_meaning: not_applicable
    missing_strategy: unknown_category
    codebook: null
    notes: >
      docs/02: "자가거주여부(3) 등 정수 코드가 코드북 없이 옴". sample.csv 전 행이 3
      값으로 등장(명세 설명상 기대값 0/1과 불일치). 코드북 미확정이므로 의미를 임의
      추정하지 않고 unknown_category로만 다룬다(null만 결측 처리, 값 자체는 원본 유지).

  현 거주지의 아파트여부:
    group: asset_housing
    dtype: categorical
    zero_meaning: normal
    missing_strategy: none
    notes: "0/1 카테고리. 0=아파트 아님(정상 카테고리, 결측 아님)."

  현 거주지의 매매가(국토부 실거래가) 또는 공시가격:
    group: asset_housing
    dtype: numeric
    zero_meaning: abnormal
    missing_strategy: regional_median_impute
    sentinel_check: true
    known_sentinel_values: [-99999999]
    join_scope: residence
    notes: "실거래가 계열. sentinel 및 0/이상값은 지역 median으로 대체."

  차량보유(국산/수입):
    group: asset_housing
    dtype: categorical
    zero_meaning: normal
    missing_strategy: unknown_category
    codebook: null
    notes: "docs/02: 0='차량없음'으로 추정되는 카테고리 코드. 결측과 구분 필요 -> null만 결측 처리."

  추정 LTV:
    group: estimated_model
    dtype: numeric
    zero_meaning: normal
    missing_strategy: none
    notes: "대출 없으면 LTV=0 정상(docs/02)."

  추정DTI:
    group: estimated_model
    dtype: numeric
    zero_meaning: normal
    missing_strategy: none
    notes: "대출 없으면 DTI=0 정상(docs/02)."

  신용평점:
    group: estimated_model
    dtype: numeric
    zero_meaning: conditional
    missing_strategy: conditional_thin_filer
    depends_on: Thin Filer 여부
    notes: >
      docs/02: "신용평점 0/저평점은 Thin Filer 여부와 교차 확인... Thin Filer=1이면
      신용평점 산출 자체가 안됨". Thin Filer=1이면 원본값 유지 + 구조적 결측 플래그만
      추가(대체값을 임의로 만들지 않음 - Thin Filer 보정 스코어는 docs/03 Layer1의 별도
      로지스틱 서브모델 담당이라 Layer0 범위 밖). Thin Filer=0인데 0/비정상 저점이면
      median 대체 + 플래그.

  총대출건수: &loan_card_delinquency_none
    group: loan_card_delinquency
    dtype: numeric
    zero_meaning: normal
    missing_strategy: none

  신용대출-총대출약정액:
    <<: *loan_card_delinquency_none

  신용대출-총대출잔액:
    <<: *loan_card_delinquency_none

  주택담보대출-총대출약정액:
    <<: *loan_card_delinquency_none

  주택담보대출-총대출잔액:
    <<: *loan_card_delinquency_none

  정책자금대출-총대출약정액:
    <<: *loan_card_delinquency_none

  정책자금대출-총대출잔액:
    <<: *loan_card_delinquency_none

  총 대출 상환금액 (최근 12개월):
    <<: *loan_card_delinquency_none

  최근 12개월 신용카드소비금액:
    <<: *loan_card_delinquency_none

  최근 12개월 체크카드소비금액:
    <<: *loan_card_delinquency_none

  최근 12개월 일시불이용금액:
    <<: *loan_card_delinquency_none

  최근 12개월 할부이용금액:
    <<: *loan_card_delinquency_none

  최근 12개월 현금서비스이용금액:
    <<: *loan_card_delinquency_none

  대출연체건수:
    group: loan_card_delinquency
    dtype: numeric
    zero_meaning: normal
    missing_strategy: none
    is_leakage_column: true
    notes: "docs/04 LEAKAGE_COLUMNS. 타겟(event) 정의 전용, 리스크예측모델 피처 절대 금지."

  카드연체건수:
    group: loan_card_delinquency
    dtype: numeric
    zero_meaning: normal
    missing_strategy: none
    is_leakage_column: true
    notes: "docs/04 LEAKAGE_COLUMNS."

  연체일수:
    group: loan_card_delinquency
    dtype: numeric
    zero_meaning: normal
    missing_strategy: none
    is_leakage_column: true
    notes: "docs/04 LEAKAGE_COLUMNS."

  대출연체금액:
    group: loan_card_delinquency
    dtype: numeric
    zero_meaning: normal
    missing_strategy: none
    is_leakage_column: true
    notes: "docs/04 LEAKAGE_COLUMNS."

  카드연체금액:
    group: loan_card_delinquency
    dtype: numeric
    zero_meaning: normal
    missing_strategy: none
    is_leakage_column: true
    notes: "docs/04 LEAKAGE_COLUMNS."

  Thin Filer 여부:
    group: other
    dtype: categorical
    zero_meaning: normal
    missing_strategy: none
    notes: "0/1 플래그. 신용평점 conditional_thin_filer 처리의 분기 기준 컬럼."

  파산, 개인회생 신청 여부:
    group: other
    dtype: categorical
    zero_meaning: normal
    missing_strategy: none

  2년내 현거주지평균실거래가:
    group: asset_housing
    dtype: numeric
    zero_meaning: not_applicable
    missing_strategy: regional_median_impute
    sentinel_check: true
    known_sentinel_values: [-99999999]
    join_scope: residence
    notes: "docs/02 확인된 sentinel 컬럼. 국토부 실거래가 매칭 실패로 추정."

  2년내 현거주지평균전세거래가:
    group: asset_housing
    dtype: numeric
    zero_meaning: not_applicable
    missing_strategy: regional_median_impute
    sentinel_check: true
    known_sentinel_values: [-99999999]
    join_scope: residence
    notes: "docs/02 확인된 sentinel 컬럼."

  2년내 직장명이력건수:
    group: life_pattern
    dtype: numeric
    zero_meaning: normal
    missing_strategy: none
    notes: "0 = 이직 없음(정상)."

defaults:
  min_sample_for_iqr: 20            # 표본이 이보다 적으면 통계적 이상치 탐지는 생략(리포트에 사유 명시)
  sentinel_iqr_multiplier: 1000     # docs/02: "정상범위(IQR)의 1000배 이상"
  min_sample_for_regional_group: 5  # 지역 그룹 표본이 이보다 적으면 상위 카테고리로 백오프
