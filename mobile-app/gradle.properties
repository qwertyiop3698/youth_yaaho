# Gradle daemon JVM 힙 설정. 이 프로젝트에 gradle.properties가 아예 없어서 Gradle
# 기본 힙(수백MB대)에 의존하고 있었던 게 R8 단계 OutOfMemoryError의 유력한 원인 -
# MPAndroidChart(레거시 View, 클래스 수 많음) + Compose + Retrofit/OkHttp +
# kotlinx.serialization을 합친 dex 대상 클래스 수가 기본 힙으로는 빠듯할 수 있다.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m
org.gradle.parallel=true

# AndroidX 사용(현재 프로젝트의 모든 의존성이 androidx.* 이므로 필수).
android.useAndroidX=true

# Kotlin 코드 스타일 - 공식 권장값.
kotlin.code.style=official
